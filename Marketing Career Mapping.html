
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Career Mapping</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#fafaf8;--bg2:#f3f1eb;--bg3:#eae8e0;
--surface:#ffffff;--border:#e0ddd4;--border2:#ccc9be;
--text:#1a1916;--text2:#5a5750;--text3:#9a9890;
--d:#1a5cf5;--d-bg:#eff4ff;--d-bd:#c3d4fd;
--co:#0f9d6a;--co-bg:#edfaf4;--co-bd:#b3e8d2;
--br:#b83025;--br-bg:#fef0ee;--br-bd:#f9c0b9;
--da:#7c3aed;--da-bg:#f3eeff;--da-bd:#d4bbfd;
--pr2:#c27213;--pr2-bg:#fdf5e6;--pr2-bd:#f5d899;
--ag:#1a8a9d;--ag-bg:#eaf8fb;--ag-bd:#a9dfe8;
--pr:#b5470c;--pr-bg:#fef3ec;--pr-bd:#f9c99b;
--ex:#374151;--ex-bg:#f4f4f2;--ex-bd:#d1d0ca;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* HEADER */
.hdr{background:var(--text);color:#fff;padding:56px 48px 44px;position:relative;overflow:hidden}
.hdr::before{content:'MARKETING';position:absolute;right:-10px;top:-8px;font-family:'DM Serif Display',serif;font-size:170px;color:rgba(255,255,255,.04);pointer-events:none;white-space:nowrap;line-height:1;user-select:none}
.hdr-eye{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:12px}
.hdr-title{font-family:'DM Serif Display',serif;font-size:clamp(30px,5vw,50px);font-weight:400;line-height:1.15;margin-bottom:6px}
.hdr-title em{font-style:italic;color:rgba(255,255,255,.55)}
.hdr-sub{font-size:14px;color:rgba(255,255,255,.45);margin-bottom:32px}
.hdr-stats{display:flex;gap:40px;flex-wrap:wrap;padding-top:24px;border-top:1px solid rgba(255,255,255,.1)}
.stat-num{font-family:'DM Serif Display',serif;font-size:34px;line-height:1;margin-bottom:4px}
.stat-lbl{font-size:12px;color:rgba(255,255,255,.4);font-weight:500}

/* FILTER BAR */
.fbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 48px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:100;box-shadow:0 1px 0 var(--border)}
.flabel{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;margin-right:2px;white-space:nowrap}
.fbtn{padding:5px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12.5px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;white-space:nowrap}
.fbtn:hover{border-color:var(--text);color:var(--text)}
.fbtn.on{background:var(--text);color:#fff;border-color:var(--text)}
.fsep{width:1px;height:20px;background:var(--border);flex-shrink:0}

/* BODY */
.body{max-width:1200px;margin:0 auto;padding:36px 48px 100px}

/* TRACK */
.track{margin-bottom:16px;border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:opacity .2s}
.track.dim{opacity:.18;pointer-events:none}
.thead{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none;transition:background .15s}
.thead:hover{background:var(--bg2)}
.ticon{font-size:22px;width:40px;text-align:center;flex-shrink:0}
.tmeta{flex:1}
.tname{font-size:16px;font-weight:600;margin-bottom:2px}
.tdesc{font-size:12.5px;color:var(--text3)}
.tcnt{font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap}
.tchev{font-size:14px;color:var(--text3);transition:transform .25s;flex-shrink:0}
.track.closed .tchev{transform:rotate(-90deg)}
.tbody{border-top:1px solid var(--border)}
.track.closed .tbody{display:none}

/* LEVEL ROW */
.lvlrow{display:grid;grid-template-columns:88px 1fr;border-bottom:1px solid var(--border)}
.lvlrow:last-child{border-bottom:none}
.lvlrow.hide{display:none}
.llabel{display:flex;align-items:center;justify-content:center;padding:12px 6px;border-right:1px solid var(--border);background:var(--bg)}
.ltxt{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.lcards{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:200px;cursor:pointer;transition:all .15s;flex-shrink:0}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.07)}
.ctop{padding:11px 13px 9px;border-bottom:1px solid var(--border)}
.ctitle{font-size:12.5px;font-weight:600;line-height:1.35;margin-bottom:3px}
.csalary{font-size:11px;color:var(--text3)}
.cbot{padding:7px 13px;display:flex;flex-wrap:wrap;gap:4px}
.ctag{font-size:10px;padding:2px 7px;border-radius:4px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-weight:500}

/* TRACK COLOR THEMES */
.t-d .thead{background:var(--d-bg)}.t-d .tname{color:var(--d)}.t-d .tcnt{background:var(--d-bg);color:var(--d);border:1px solid var(--d-bd)}.t-d .card{border-color:var(--d-bd)}.t-d .ctitle{color:var(--d)}.t-d .ctag{background:var(--d-bg);color:var(--d);border-color:var(--d-bd)}.t-d .card:hover{border-color:var(--d)}.t-d .llabel{background:var(--d-bg)}
.t-co .thead{background:var(--co-bg)}.t-co .tname{color:var(--co)}.t-co .tcnt{background:var(--co-bg);color:var(--co);border:1px solid var(--co-bd)}.t-co .card{border-color:var(--co-bd)}.t-co .ctitle{color:var(--co)}.t-co .ctag{background:var(--co-bg);color:var(--co);border-color:var(--co-bd)}.t-co .card:hover{border-color:var(--co)}.t-co .llabel{background:var(--co-bg)}
.t-br .thead{background:var(--br-bg)}.t-br .tname{color:var(--br)}.t-br .tcnt{background:var(--br-bg);color:var(--br);border:1px solid var(--br-bd)}.t-br .card{border-color:var(--br-bd)}.t-br .ctitle{color:var(--br)}.t-br .ctag{background:var(--br-bg);color:var(--br);border-color:var(--br-bd)}.t-br .card:hover{border-color:var(--br)}.t-br .llabel{background:var(--br-bg)}
.t-da .thead{background:var(--da-bg)}.t-da .tname{color:var(--da)}.t-da .tcnt{background:var(--da-bg);color:var(--da);border:1px solid var(--da-bd)}.t-da .card{border-color:var(--da-bd)}.t-da .ctitle{color:var(--da)}.t-da .ctag{background:var(--da-bg);color:var(--da);border-color:var(--da-bd)}.t-da .card:hover{border-color:var(--da)}.t-da .llabel{background:var(--da-bg)}
.t-pr2 .thead{background:var(--pr2-bg)}.t-pr2 .tname{color:var(--pr2)}.t-pr2 .tcnt{background:var(--pr2-bg);color:var(--pr2);border:1px solid var(--pr2-bd)}.t-pr2 .card{border-color:var(--pr2-bd)}.t-pr2 .ctitle{color:var(--pr2)}.t-pr2 .ctag{background:var(--pr2-bg);color:var(--pr2);border-color:var(--pr2-bd)}.t-pr2 .card:hover{border-color:var(--pr2)}.t-pr2 .llabel{background:var(--pr2-bg)}
.t-ag .thead{background:var(--ag-bg)}.t-ag .tname{color:var(--ag)}.t-ag .tcnt{background:var(--ag-bg);color:var(--ag);border:1px solid var(--ag-bd)}.t-ag .card{border-color:var(--ag-bd)}.t-ag .ctitle{color:var(--ag)}.t-ag .ctag{background:var(--ag-bg);color:var(--ag);border-color:var(--ag-bd)}.t-ag .card:hover{border-color:var(--ag)}.t-ag .llabel{background:var(--ag-bg)}
.t-pr .thead{background:var(--pr-bg)}.t-pr .tname{color:var(--pr)}.t-pr .tcnt{background:var(--pr-bg);color:var(--pr);border:1px solid var(--pr-bd)}.t-pr .card{border-color:var(--pr-bd)}.t-pr .ctitle{color:var(--pr)}.t-pr .ctag{background:var(--pr-bg);color:var(--pr);border-color:var(--pr-bd)}.t-pr .card:hover{border-color:var(--pr)}.t-pr .llabel{background:var(--pr-bg)}
.t-ex .thead{background:var(--ex-bg)}.t-ex .tname{color:var(--ex)}.t-ex .tcnt{background:var(--ex-bg);color:var(--ex);border:1px solid var(--ex-bd)}.t-ex .card{border-color:var(--ex-bd)}.t-ex .ctitle{color:var(--ex)}.t-ex .ctag{background:var(--ex-bg);color:var(--ex);border-color:var(--ex-bd)}.t-ex .card:hover{border-color:var(--ex)}.t-ex .llabel{background:var(--ex-bg)}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:680px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.18)}
.mbar{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:10;border-radius:18px 18px 0 0}
.mtitle{font-size:14px;font-weight:600;color:var(--text2)}
.mclose{background:var(--bg2);border:1px solid var(--border);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--text);font-family:monospace}
.mclose:hover{background:var(--bg3)}
.mbody{padding:22px}
.mh{font-family:'DM Serif Display',serif;font-size:24px;line-height:1.2;margin-bottom:5px}
.mdesc{font-size:13.5px;color:var(--text2);line-height:1.65;margin-bottom:14px}
.mbadges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}
.mbadge{font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;border:1px solid var(--border2);color:var(--text2)}
.msec{margin-bottom:16px}
.mstitle{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.mlist{list-style:none}
.mlist li{font-size:13.5px;color:var(--text2);padding:5px 0;border-bottom:1px solid var(--bg2);display:flex;align-items:flex-start;gap:9px;line-height:1.5}
.mlist li:last-child{border-bottom:none}
.mlist li::before{content:'→';font-size:10px;opacity:.4;flex-shrink:0;margin-top:3px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.mbox{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:13px}
.mboxt{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:9px}
.fitbar{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px}
.fitrow{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12.5px}
.fitrow:last-child{margin-bottom:0}
.fitkey{width:95px;color:var(--text2);flex-shrink:0;font-weight:500}
.fitwrap{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.fitfill{height:100%;border-radius:3px;transition:width .5s ease}
.fitpct{width:34px;text-align:right;color:var(--text3);font-size:11px}
.mtags{display:flex;flex-wrap:wrap;gap:6px}
.mtag{font-size:12px;padding:3px 9px;border-radius:5px;background:var(--bg2);border:1px solid var(--border);color:var(--text)}
.mnext{display:flex;flex-wrap:wrap;gap:6px}
.mnextitem{font-size:12px;padding:4px 10px;border-radius:5px;border:1px solid var(--border2);color:var(--text2);background:var(--surface)}
.tip{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--d);border-radius:10px;padding:16px 20px;font-size:13px;color:var(--text2);line-height:1.7;margin-top:40px}
.tip strong{color:var(--text)}

@media(max-width:700px){
.hdr{padding:32px 20px}
.fbar{padding:12px 16px}
.body{padding:20px 16px 60px}
.mgrid{grid-template-columns:1fr}
.card{width:160px}
.lvlrow{grid-template-columns:56px 1fr}
}
</style>
</head>

const FILTERS=[
{id:'all',label:'Tất cả'},{sep:1},
{id:'d',label:'📊 Digital'},{id:'co',label:'✍️ Content'},{id:'br',label:'🏷️ Brand'},{id:'da',label:'📈 Data'},{id:'pr2',label:'🚀 Product'},{id:'ag',label:'🏢 Agency'},{id:'pr',label:'📣 PR'},{id:'ex',label:'👑 Leadership'},
{sep:1},
{id:'entry',label:'Intern/Fresher'},{id:'mid',label:'Specialist'},{id:'senior',label:'Manager+'}
];

let af='all';
const trackIds=DATA.map(t=>t.id);
const levelIds=['entry','mid','senior','clevel'];

function buildFilters(){
  const bar=document.getElementById('fbar');
  bar.innerHTML='<span class="flabel">Lọc:</span>';
  FILTERS.forEach(f=>{
    if(f.sep){const s=document.createElement('span');s.className='fsep';bar.appendChild(s);return;}
    const b=document.createElement('button');
    b.className='fbtn'+(f.id==='all'?' on':'');
    b.textContent=f.label;b.onclick=()=>setFilter(f.id,b);bar.appendChild(b);
  });
}

function setFilter(id,btn){
  af=id;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  document.querySelectorAll('.track').forEach(tr=>{
    tr.classList.toggle('dim',trackIds.includes(id)&&tr.dataset.id!==id);
  });
  document.querySelectorAll('.lvlrow').forEach(r=>{
    r.classList.toggle('hide',levelIds.includes(id)&&r.dataset.lid!==id);
  });
}

function buildTracks(){
  const wrap=document.getElementById('bodyWrap');
  DATA.forEach(track=>{
    const total=track.levels.reduce((s,l)=>s+l.positions.length,0);
    const tr=document.createElement('div');
    tr.className='track '+track.cls;tr.dataset.id=track.id;
    const thead=document.createElement('div');thead.className='thead';
    thead.innerHTML=`<span class="ticon">${track.icon}</span><div class="tmeta"><div class="tname">${track.name}</div><div class="tdesc">${track.desc}</div></div><span class="tcnt">${total} vị trí</span><span class="tchev">▼</span>`;
    thead.onclick=()=>tr.classList.toggle('closed');tr.appendChild(thead);
    const tbody=document.createElement('div');tbody.className='tbody';
    track.levels.forEach(level=>{
      const row=document.createElement('div');row.className='lvlrow';row.dataset.lid=level.lid;
      const lc=document.createElement('div');lc.className='llabel';lc.innerHTML=`<span class="ltxt">${level.label}</span>`;
      const cards=document.createElement('div');cards.className='lcards';
      level.positions.forEach(pos=>{
        const c=document.createElement('div');c.className='card';
        c.innerHTML=`<div class="ctop"><div class="ctitle">${pos.title}</div><div class="csalary">💰 ${pos.salary}/tháng</div></div><div class="cbot">${pos.tags.slice(0,3).map(t=>`<span class="ctag">${t}</span>`).join('')}</div>`;
        c.onclick=()=>openModal(pos);cards.appendChild(c);
      });
      row.appendChild(lc);row.appendChild(cards);tbody.appendChild(row);
    });
    tr.appendChild(tbody);wrap.appendChild(tr);
  });
  const tip=document.createElement('div');tip.className='tip';
  tip.innerHTML='<strong>Lời khuyên cho bạn — sinh viên mới ra trường:</strong> Đừng cố chọn "con đường đúng nhất" ngay từ đầu. Hãy chọn vị trí giúp bạn <strong>học nhanh nhất trong 1–2 năm đầu</strong>. Agency và startup thường là lựa chọn tốt vì bạn tiếp xúc nhiều kênh, nhiều ngành, nhiều tình huống thực tế. Sau đó, khi đã biết mình giỏi gì và thích gì, hãy chuyên sâu và thăng tiến trong ngách đó. Marketing là ngành <strong>càng làm nhiều càng giỏi</strong> — hành động sớm quan trọng hơn chuẩn bị hoàn hảo.';
  wrap.appendChild(tip);
}

function openModal(pos){
  document.getElementById('modalTitle').textContent=pos.title;
  const fitHTML=Object.entries(pos.fit).map(([k,v])=>`<div class="fitrow"><span class="fitkey">${FL[k]}</span><div class="fitwrap"><div class="fitfill" style="width:${v}%;background:${FC[k]}"></div></div><span class="fitpct">${v}%</span></div>`).join('');
  document.getElementById('modalBody').innerHTML=`
    <div class="mh">${pos.title}</div>
    <div class="mdesc">${pos.desc}</div>
    <div class="mbadges"><span class="mbadge">💰 ${pos.salary}/tháng</span>${pos.tags.map(t=>`<span class="mbadge">${t}</span>`).join('')}</div>
    <div class="fitbar"><div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:11px">Yêu cầu tố chất</div>${fitHTML}</div>
    <div class="msec"><div class="mstitle">Công việc hàng ngày</div><ul class="mlist">${pos.daily.map(d=>`<li>${d}</li>`).join('')}</ul></div>
    <div class="mgrid">
      <div class="mbox"><div class="mboxt">Kỹ năng cần có</div><ul class="mlist">${pos.skills.map(s=>`<li>${s}</li>`).join('')}</ul></div>
      <div class="mbox"><div class="mboxt">Công cụ & nền tảng</div><ul class="mlist">${pos.tools.map(t=>`<li>${t}</li>`).join('')}</ul></div>
    </div>
    ${pos.certs.length?`<div class="msec"><div class="mstitle">Chứng chỉ nên có</div><div class="mtags">${pos.certs.map(c=>`<span class="mtag">🎓 ${c}</span>`).join('')}</div></div>`:''}
    <div class="msec"><div class="mstitle">Cách bắt đầu & ứng tuyển</div><ul class="mlist">${pos.howto.map(h=>`<li>${h}</li>`).join('')}</ul></div>
    <div class="msec"><div class="mstitle">Bước tiếp theo sau vị trí này</div><div class="mnext">${pos.next.map(n=>`<span class="mnextitem">→ ${n}</span>`).join('')}</div></div>`;
  document.getElementById('overlay').classList.add('open');
}

function closeModal(){document.getElementById('overlay').classList.remove('open');}
document.getElementById('overlay').onclick=e=>{if(e.target===document.getElementById('overlay'))closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
buildFilters();buildTracks();
</script>
